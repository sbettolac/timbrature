<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timbrature">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Sistema Timbrature</title>
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icone/icona-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Notifica globale -->
  <div id="notification" class="notification hidden" role="alert"></div>

  <!-- Overlay di caricamento -->
  <div id="loading-overlay" class="loading-overlay hidden" aria-busy="true">
    <div class="spinner"></div>
    <span id="loading-text">Caricamento…</span>
  </div>

  <!-- Header -->
  <header id="app-header" class="app-header hidden">
    <div class="header-left">
      <button id="btn-menu" class="icon-btn" aria-label="Menu">&#9776;</button>
      <h1 id="header-title" class="header-title">Timbrature</h1>
    </div>
    <div class="header-right">
      <span id="header-user" class="header-user"></span>
      <button id="btn-logout" class="icon-btn" aria-label="Logout" title="Logout">&#x2715;</button>
    </div>
  </header>

  <!-- Contenuto principale -->
  <main id="main-content" class="main-content"></main>

  <!-- Bottom navigation (utente) -->
  <nav id="bottom-nav" class="bottom-nav hidden" role="navigation">
    <button class="nav-btn" data-view="home"        aria-label="Home">
      <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-view="calendario"  aria-label="Calendario">
      <span class="nav-icon">📅</span><span class="nav-label">Calendario</span>
    </button>
    <button class="nav-btn" data-view="monte_ore"   aria-label="Monte Ore">
      <span class="nav-icon">⏱</span><span class="nav-label">Ore</span>
    </button>
    <button class="nav-btn" data-view="storico"     aria-label="Storico">
      <span class="nav-icon">📋</span><span class="nav-label">Storico</span>
    </button>
    <button class="nav-btn hidden" id="nav-squadra" data-view="resp_giornata" aria-label="Squadra">
      <span class="nav-icon">👥</span><span class="nav-label">Squadra</span>
    </button>
  </nav>

  <!-- Bottom navigation (admin) -->
  <nav id="admin-nav" class="bottom-nav hidden" role="navigation">
    <button class="nav-btn" data-view="admin_dashboard"   aria-label="Dashboard">
      <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-btn" data-view="home"              aria-label="Timbra">
      <span class="nav-icon">⏱</span><span class="nav-label">Timbra</span>
    </button>
    <button class="nav-btn" data-view="admin_timbrature"  aria-label="Timbrature">
      <span class="nav-icon">📝</span><span class="nav-label">Timbrature</span>
    </button>
    <button class="nav-btn" data-view="admin_mese"        aria-label="Riepilogo del mese">
      <span class="nav-icon">🗓</span><span class="nav-label">Mese</span>
    </button>
    <button class="nav-btn" data-view="admin_utenti"      aria-label="Utenti">
      <span class="nav-icon">👥</span><span class="nav-label">Utenti</span>
    </button>
  </nav>

  <!-- Modale generica -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
